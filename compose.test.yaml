services:
  app:
    build: .
    env_file: .env.test
    ports:
      - 127.0.0.1:5173:3000
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: mayb_log_test
      POSTGRES_USER: mayb_log_test
      POSTGRES_PASSWORD: mayb-log-test-password
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-test:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mayb_log_test -d mayb_log_test]
      interval: 3s
      timeout: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: mayb-log-test-media
    ports:
      - 127.0.0.1:3900:3900
    volumes:
      - ./deployment/garage.toml:/etc/garage.toml:ro
      - garage-meta-test:/var/lib/garage/meta
      - garage-data-test:/var/lib/garage/data
    healthcheck:
      test: [CMD, /garage, status]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-test:
  garage-meta-test:
  garage-data-test:
