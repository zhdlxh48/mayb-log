name: Verify and publish image

on:
  pull_request:
  push:
    branches: [main, dev, 'rewrite/**', 'feature/**', 'hotfix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mayb-log-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - name: Reset test containers
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
      - run: pnpm test:smoke
      - run: pnpm build
      - name: Validate production Compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Build production image
        run: docker build --tag mayb-log:test .
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zhdlxh48/mayb-log:main
            ghcr.io/zhdlxh48/mayb-log:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
