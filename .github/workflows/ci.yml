name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main, dev, 'rewrite/**', 'feature/**', 'hotfix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure local test environment
        run: |
          cat > .dev.vars <<'EOF'
          BETTER_AUTH_SECRET=local-ci-secret-with-more-than-thirty-two-characters
          TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
          SITE_URL=http://localhost:5173
          TURNSTILE_SITE_KEY=1x00000000000000000000AA
          EOF
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm db:migrate:local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - run: pnpm build
      - name: Apply production migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy new Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
