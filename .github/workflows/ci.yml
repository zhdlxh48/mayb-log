name: Verify and publish image

on:
  pull_request:
  push:
    branches: [main, dev, 'rewrite/**', 'feature/**', 'hotfix/**', 'refactor/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayb-log-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mayb-log-ci-${{ github.run_id }}-${{ github.run_attempt }}
      MAYB_LOG_TEST_IMAGE: mayb-log:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.MAYB_LOG_TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: pnpm exec playwright install --with-deps chromium
      - name: Reset test containers
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
      - run: pnpm test:smoke
      - run: pnpm test:migrations
      - name: Validate production Compose
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Export verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "${MAYB_LOG_TEST_IMAGE}" | gzip -1 > mayb-log-image.tar.gz
      - name: Upload verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mayb-log-image-${{ github.sha }}
          path: mayb-log-image.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mayb-log-image-${{ github.sha }}
      - name: Load verified image
        run: gzip -dc mayb-log-image.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        env:
          SOURCE_IMAGE: mayb-log:ci-${{ github.sha }}
          TARGET_IMAGE: ghcr.io/zhdlxh48/mayb-log
        run: |
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE:main"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE:sha-${{ github.sha }}"
          docker push "$TARGET_IMAGE:main"
          docker push "$TARGET_IMAGE:sha-${{ github.sha }}"
